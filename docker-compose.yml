services:
  alleria-filmy:
    build: .
    container_name: alleria-filmy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - alleria-data:/app/backend/data
      - ./.env:/app/.env:ro
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - streaming

  streaming:
    build: ./streaming
    container_name: alleria-streaming
    volumes:
      # Set STREAM_HOST_DATA_DIR in .env to point this at a real host path (NFS/Tailscale/array
      # mount) — NEVER hardcode a custom path directly on the line below. This file gets
      # re-copied/reset on updates, which would silently reset the mount back to the plain
      # `stream-data` Docker volume and make the app see an empty library (all existing videos'
      # HLS files still exist at the real path — the container just isn't looking at it anymore).
      - ${STREAM_HOST_DATA_DIR:-stream-data}:/data
    environment:
      # No default here on purpose — a fallback would be a fixed, publicly-known-from-
      # source secret protecting every video's access control. Set STREAM_SECRET in .env.
      - STREAM_SECRET=${STREAM_SECRET:?Set STREAM_SECRET in your .env file (see .env.example) — it must not be left at its default}
      - STREAM_PORT=4000
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
      - STREAM_PUBLIC_URL=${STREAM_PUBLIC_URL:-http://localhost:3000/stream}
      # Custom storage paths (optional — defaults to /data subdirs)
      # - STREAM_DATA_DIR=/data
      # - STREAM_MEDIA_DIR=/mnt/user/alleria-streaming/videos
    restart: unless-stopped
    expose:
      - "4000"

volumes:
  alleria-data:
    driver: local
  stream-data:
    driver: local
