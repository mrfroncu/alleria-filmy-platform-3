services:
  alleria-filmy:
    build: .
    container_name: alleria-filmy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - alleria-data:/app/backend/data
      - ./.env:/app/.env:ro
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - streaming

  streaming:
    build:
      context: ./streaming
      args:
        # Speech-to-text model for transcription (tiny/base/small/medium/large-v3) — bigger is
        # more accurate but slower on CPU. Set WHISPER_MODEL in .env to override.
        WHISPER_MODEL: ${WHISPER_MODEL:-small}
    container_name: alleria-streaming
    volumes:
      # Default: Docker volume. To use custom path (e.g. NFS/Tailscale mount):
      # Replace with: - /mnt/user/alleria-streaming:/data
      - stream-data:/data
    environment:
      - STREAM_SECRET=${STREAM_SECRET:-alleria-stream-key}
      - STREAM_PORT=4000
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
      - STREAM_PUBLIC_URL=${STREAM_PUBLIC_URL:-http://localhost:3000/stream}
      # Custom storage paths (optional — defaults to /data subdirs)
      # - STREAM_DATA_DIR=/data
      # - STREAM_MEDIA_DIR=/mnt/user/alleria-streaming/videos
    restart: unless-stopped
    expose:
      - "4000"

volumes:
  alleria-data:
    driver: local
  stream-data:
    driver: local
