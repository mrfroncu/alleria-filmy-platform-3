version: '3.8'

services:
  alleria-filmy:
    build: .
    container_name: alleria-filmy
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - alleria-data:/app/backend/data
      - ./.env:/app/.env:ro
    restart: unless-stopped
    environment:
      - NODE_ENV=production

volumes:
  alleria-data:
    driver: local
