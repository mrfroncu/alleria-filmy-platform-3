# Alleria Filmy — GPU (NVENC) transcoding
#
# Merge on top of the base docker-compose.yml to make the streaming service encode with the
# host's NVIDIA GPU instead of the CPU. Requires the NVIDIA Container Toolkit already working
# for a plain custom container on this host (Unraid: the "Nvidia-Driver" plugin) — confirm with
# something like:
#   docker run --rm --runtime=nvidia -e NVIDIA_VISIBLE_DEVICES=all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Optional .env keys (defaults below match "give it every GPU, every capability" — narrow them
# if you have multiple GPUs and want the streaming container pinned to just one, the way the
# NVIDIA_VISIBLE_DEVICES value in Unraid's own container configs pins a specific GPU UUID):
#   NVIDIA_VISIBLE_DEVICES=all           # or a GPU UUID, e.g. GPU-1cb7b75e-20e3-5e0e-4cd8-4151783b3274
#   NVIDIA_DRIVER_CAPABILITIES=all       # or the minimal "video,compute,utility" needed for NVENC

services:
  streaming:
    runtime: nvidia
    environment:
      - STREAM_USE_GPU=true
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-all}
