# Alleria Filmy — Panel Only
# Use when the streaming service runs on a separate server (see streaming-standalone/).
#
# Usage:
#   docker compose -f docker-compose.panel-only.yml up -d --build
#
# Required .env keys:
#   STREAM_URL=http://<streaming-server-ip>:4000   ← point to your standalone streamer
#   STREAM_SECRET=<same secret as on streaming server>
#   SESSION_SECRET=<random secret>
#   DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET, DISCORD_BOT_TOKEN, DISCORD_GUILD_ID, DISCORD_MEMBER_ROLE_ID

services:
  alleria-filmy:
    build: .
    container_name: alleria-filmy
    # Zadnego portu na hoscie - Traefik siega tej uslugi po sieci 'edge',
    # a PORT z .env steruje wylacznie tym, na czym aplikacja slucha w srodku.
    # (Wczesniej PORT trafial jednoczesnie do publikacji i do nasluchu, co
    # konczylo sie bledem 502.)
    env_file:
      - .env
    volumes:
      - alleria-data:/app/backend/data
      - ./.env:/app/.env:ro
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    # Traefik siega tej uslugi po sieci 'edge', a nie przez port na hoscie -
    # dlatego PORT w .env jest przypiety do 127.0.0.1. Reguly musza byc tutaj,
    # w repozytorium: synchronizacja GitOps usuwa z katalogu projektu wszystko,
    # czego nie ma w gicie (sprawdzone), wiec lokalna nakladka nie przezyje.
    networks: [default, edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.videos.rule=Host(`videos.alleria.pl`)
      - traefik.http.routers.videos.entryPoints=websecure
      - traefik.http.routers.videos.tls.certResolver=le
      - traefik.http.services.videos.loadbalancer.server.port=3000

networks:
  # Siec, w ktorej Traefik odnajduje te usluge. Na hoscie tworzona raz:
  #   docker network create edge
  edge:
    external: true

volumes:
  alleria-data:
    driver: local
