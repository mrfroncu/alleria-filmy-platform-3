# Alleria Streaming Service — Standalone Deployment
# Deploy on a separate server, connect from main app via Tailscale/VPN
#
# Usage:
#   1. Copy streaming/server.js, streaming/package.json and streaming/versions.js into this folder
#   2. Copy .env.example to .env and configure
#   3. docker compose up -d
#
# On the main app server, set:
#   STREAM_URL=http://<this-server-tailscale-ip>:4000

services:
  streaming:
    build: .
    container_name: alleria-streaming
    ports:
      # Expose port — accessible via Tailscale IP from main app server
      - "${STREAM_PORT:-4000}:4000"
    env_file:
      - .env
    volumes:
      # Set STREAM_HOST_DATA_DIR in .env to point this at a real host path (NFS/Tailscale/array
      # mount) — NEVER hardcode a custom path directly on the line below. This file gets
      # re-copied/reset on updates (see the "Usage" note at the top of this file), which would
      # silently reset the mount back to the plain `stream-data` Docker volume and make the app
      # see an empty library (all existing videos' HLS files still exist at the real path — the
      # container just isn't looking at it anymore).
      - ${STREAM_HOST_DATA_DIR:-stream-data}:/data
    environment:
      - STREAM_SECRET=${STREAM_SECRET:-change-me}
      - STREAM_PORT=4000
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
      - STREAM_PUBLIC_URL=${STREAM_PUBLIC_URL:-http://localhost:4000}
    restart: unless-stopped

volumes:
  stream-data:
    driver: local
