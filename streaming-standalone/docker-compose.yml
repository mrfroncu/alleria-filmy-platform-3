# Alleria Streaming Service — Standalone Deployment
# Deploy on a separate server, connect from main app via Tailscale/VPN. Builds directly from
# ../streaming — the sibling folder in this same repo checkout — so there's exactly one copy
# of server.js/package.json/versions.js/Dockerfile in the whole repo (previously this folder
# had its own manually-copied duplicates, which silently drifted from ../streaming more than
# once). This means the FULL repo must be present on this host, not just this one folder.
#
# Usage:
#   1. Copy .env.example to .env and configure
#   2. docker compose up -d --build
#
# On the main app server, set:
#   STREAM_URL=http://<this-server-tailscale-ip>:4000

services:
  streaming:
    build:
      context: ../streaming
    container_name: alleria-streaming
    ports:
      # Expose port — accessible via Tailscale IP from main app server
      - "${STREAM_PORT:-4000}:4000"
    env_file:
      - .env
    volumes:
      # Set STREAM_HOST_DATA_DIR in .env to point this at a real host path (NFS/Tailscale/array
      # mount) — NEVER hardcode a custom path directly on the line below. This file is tracked
      # in git, so a `git pull` on an update overwrites a hand-edit here back to this default,
      # which would silently reset the mount to the plain `stream-data` Docker volume and make
      # the app see an empty library (all existing videos' HLS files still exist at the real
      # path — the container just isn't looking at it anymore).
      - ${STREAM_HOST_DATA_DIR:-stream-data}:/data
    environment:
      # No default here on purpose — a fallback would be a fixed, publicly-known-from-
      # source secret protecting every video's access control. Set STREAM_SECRET in .env.
      - STREAM_SECRET=${STREAM_SECRET:?Set STREAM_SECRET in your .env file — it must not be left at its default}
      - STREAM_PORT=4000
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
      - STREAM_PUBLIC_URL=${STREAM_PUBLIC_URL:-http://localhost:4000}
      # Optional GPU (NVENC) transcoding. Set STREAM_USE_GPU=true in .env and run with
      # docker-compose.gpu.yml (in this folder) merged in — it adds the `runtime: nvidia`
      # this alone doesn't provide. Requires the NVIDIA Container Toolkit already working
      # for a plain custom container on this host.
      - STREAM_USE_GPU=${STREAM_USE_GPU:-false}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-}
    restart: unless-stopped

volumes:
  stream-data:
    driver: local
