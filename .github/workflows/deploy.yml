name: Deploy via rsync

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Rsync deploy
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ deploy@${{ secrets.SSH_HOST }}:/root/video-new-gen5/1/

      - name: Run Docker Compose
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no deploy@${{ secrets.SSH_HOST }} << 'EOF'
            cd /root/video-new-gen5/1/

            docker compose down
            docker compose build --no-cache
            docker compose up -d
          EOF
