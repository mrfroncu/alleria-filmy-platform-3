name: Deploy via rsync

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Rsync deploy
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='tests' \
            --exclude='node_modules' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ deploy@${{ secrets.SSH_HOST }}:/home/deploy/video-platform/

      - name: Run Docker Compose
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no deploy@${{ secrets.SSH_HOST }} << 'EOF'
            cd /home/deploy/video-platform/

            docker compose -f docker-compose.panel-only.yml down
            docker compose -f docker-compose.panel-only.yml build --no-cache
            docker compose -f docker-compose.panel-only.yml up -d
          EOF
