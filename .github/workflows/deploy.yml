name: Deploy via rsync

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag/branch/commit do wdrożenia'
        required: false
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.release.tag_name }}

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Rsync deploy
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='tests' \
            --exclude='node_modules' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ deploy@${{ secrets.SSH_HOST }}:/home/deploy/video-platform/

      - name: Run Docker Compose
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no deploy@${{ secrets.SSH_HOST }} << 'EOF'
            cd /home/deploy/video-platform/

            # Idempotent: only creates/starts the maintenance proxy + alleria-edge network if
            # they're missing, never touches an already-running proxy. Guarantees
            # docker-compose.panel-only.yml always has the network it depends on, even on a
            # fresh server.
            docker compose -f docker-compose.proxy.yml up -d

            docker compose -f docker-compose.panel-only.yml down
            docker compose -f docker-compose.panel-only.yml build --no-cache
            docker compose -f docker-compose.panel-only.yml up -d
          EOF
