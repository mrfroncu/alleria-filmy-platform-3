name: Deploy watch-party (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: watch-party

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Rsync deploy
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ deploy@${{ secrets.SSH_HOST }}:/home/deploy/video-platform-watch-party/

      - name: Run Docker Compose
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no deploy@${{ secrets.SSH_HOST }} << 'EOF'
            cd /home/deploy/video-platform-watch-party/

            docker compose down
            docker compose build --no-cache
            docker compose up -d
          EOF
