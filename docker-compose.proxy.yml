# Alleria Filmy — Maintenance proxy
#
# Sits in front of alleria-filmy and keeps a listener on the public port at all times, so
# Cloudflare Tunnel always gets a real HTTP response — even mid-deploy, while alleria-filmy
# is down for a rebuild. Serves a branded "back soon" page instead of Cloudflare's own
# generic Bad Gateway screen whenever the app container is unreachable.
#
# One-time setup on the server (creates the alleria-edge network alleria-filmy joins too):
#   docker compose -f docker-compose.proxy.yml up -d
#
# Point cloudflared at this container instead of the app directly — same port as before
# (http://localhost:3000), nothing changes on the Cloudflare side.
#
# Not touched by the deploy workflow: .github/workflows/deploy.yml only ever runs
# docker-compose.panel-only.yml, so this container is never stopped or rebuilt by a deploy.

services:
  proxy:
    image: caddy:2-alpine
    container_name: alleria-proxy
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - alleria-edge

networks:
  alleria-edge:
    name: alleria-edge
